<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.webp" />
    <link rel="stylesheet" href="./src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script type="module" src="./src/main.js"></script>

    <div id="simulator-ui">

      <!-- 로봇 리스트 -->
      <div id="robot-list">
        <h3>Robot List</h3>
        <ul id="robot-items"></ul>
      </div>

      <!-- 로봇 상세 정보 -->
      <div id="robot-info">
        <h3>Robot Info</h3>
        <div>ID: <span id="robot-id">-</span></div>
        <div>State: <span id="robot-state">-</span></div>
        <div>Speed: <input type="range" id="robot-speed" min="0.1" max="3" step="0.1"></div>
        <button id="charge-btn">Request Charging (Add to Queue)</button>
        <button id="pause-btn">Pause / Resume</button>
      </div>

      <!-- 로봇 대기 큐 -->
      <div id="robot-queue">
        <h3>Charging Queue</h3>
        <ul id="queue-items"></ul>
      </div>

    </div>

    <canvas id="three-canvas"></canvas>
  </body>
</html>
